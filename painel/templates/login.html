{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="cartao" style="max-width:360px; margin:60px auto">
  <h2>Entrar</h2>
  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
  <form method="post" action="/login">
    <p><input name="login" placeholder="Usuário" required autofocus style="width:100%"></p>
    <p><input name="senha" type="password" placeholder="Senha" required style="width:100%"></p>
    <p><button type="submit" style="width:100%">Entrar</button></p>
  </form>
</div>
{% endblock %}
