<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Painel{% endblock %} · Discadora</title>
<style>
  :root { --azul: #232657; --laranja: #e74e1c; --fundo: #f5f6fa; --borda: #dde0ea; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--fundo); color: #1d1f2c; }
  header { background: var(--azul); color: #fff; padding: 12px 20px;
           display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  header a { color: #fff; text-decoration: none; opacity: .85; }
  header a:hover { opacity: 1; border-bottom: 2px solid var(--laranja); }
  header .marca { font-weight: 700; margin-right: auto; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .cartao { background: #fff; border: 1px solid var(--borda); border-radius: 8px;
            padding: 20px; margin-bottom: 16px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .grade a { display: block; background: #fff; border: 1px solid var(--borda); border-radius: 8px;
             padding: 20px; color: inherit; text-decoration: none; font-weight: 600; }
  .grade a:hover { border-color: var(--laranja); }
  input, select, button { font: inherit; padding: 8px 10px; border: 1px solid var(--borda);
                          border-radius: 6px; }
  button { background: var(--azul); color: #fff; border: 0; cursor: pointer; }
  button:hover { background: var(--laranja); }
  .erro { color: #b00020; }
  .discreto { color: #666; font-size: .9em; }
</style>
</head>
<body>
{% if usuario %}
<header>
  <a class="marca" href="/">Discadora</a>
  {% for chave, titulo, url in usuario.modulos %}<a href="{{ url }}">{{ titulo }}</a>{% endfor %}
  <span class="discreto" style="color:#ccd">{{ usuario.nome }} · {{ usuario.perfil }}</span>
  <a href="/sair">Sair</a>
</header>
{% endif %}
<main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
